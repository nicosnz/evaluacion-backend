services:
  database_restaurante:
    container_name: database-restaurante
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ev2:/var/lib/postgresql/data
      - ./db-desing:/docker-entrypoint-initdb.d
  cache-restaurante:
    container_name: cache-restaurante
    image: redis:8.4-alpine
    ports:
      - "6379:6379"
volumes:
  ev2:
  
