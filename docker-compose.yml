services:
  database_restaurante:
    container_name: database-restaurante
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB",]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - private_net
    expose:
      - "5432"
    volumes:
      - ev2:/var/lib/postgresql/data
      - ./db-desing:/docker-entrypoint-initdb.d
  cache-restaurante:
    container_name: cache-restaurante
    image: redis:8.4-alpine
    expose:
      - "6379"
    networks:
      - private_net
  api:
    container_name: api
    build: ./src/app_api
    healthcheck:
      test: ["CMD", "curl","-f","http://localhost:8000/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - .env
    depends_on:
      database_restaurante:
        condition: service_healthy
    networks:
      - public_net
      - private_net
    expose:
      - "8000"

  proxy:
    container_name: proxy-restaurante
    image: nginx:latest
    depends_on:
      api:
        condition: service_healthy
      
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./src/ui:/usr/share/nginx/html
    ports:
      - "80:80"
    networks:
      - public_net
volumes:
  ev2:
networks:
  private_net:
    internal: true
  public_net:
  
